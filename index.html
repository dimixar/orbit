<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orbit</title>
  <script>
    // Apply the saved (or system) theme before first paint to avoid a flash.
    (function () {
      try {
        var stored = localStorage.getItem("orbit-theme");
        var media = window.matchMedia("(prefers-color-scheme: dark)");
        var dark = stored === "dark" || ((stored === "system" || stored === null) && media.matches);
        document.documentElement.classList.toggle("dark", dark);
        var accent = localStorage.getItem("orbit-accent");
        if (["teal", "blue", "violet", "rose", "amber", "green", "slate"].indexOf(accent) !== -1) {
          document.documentElement.dataset.accent = accent;
        }
      } catch (e) {}
    })();
  </script>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&family=Familjen+Grotesk:ital,wght@0,400..700;1,400..700&family=IBM+Plex+Mono:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet">

  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orbit</title>
  <script>
    // Apply the saved (or system) theme before first paint to avoid a flash.
    (function () {
      try {
        var stored = localStorage.getItem("orbit-theme");
        var media = window.matchMedia("(prefers-color-scheme: dark)");
        var dark = stored === "dark" || ((stored === "system" || stored === null) && media.matches);
        document.documentElement.classList.toggle("dark", dark);
        var accent = localStorage.getItem("orbit-accent");
        if (["teal", "blue", "violet", "rose", "amber", "green", "slate"].indexOf(accent) !== -1) {
          document.documentElement.dataset.accent = accent;
        }
        var uiFont = localStorage.getItem("orbit-font-ui");
        if (["inter", "geist", "atkinson", "source-sans-3", "roboto", "noto-sans", "dm-sans", "manrope"].indexOf(uiFont) !== -1) {
          document.documentElement.dataset.fontUi = uiFont;
        }
        var codeFont = localStorage.getItem("orbit-font-code");
        if (["system", "jetbrains", "fira-code", "geist-mono", "commit-mono", "source-code-pro", "cascadia-code", "roboto-mono", "iosevka"].indexOf(codeFont) !== -1) {
          document.documentElement.dataset.fontCode = codeFont;
        }
        var uiScale = parseFloat(localStorage.getItem("orbit-ui-scale"));
        if (uiScale >= 80 && uiScale <= 130 && uiScale !== 100) {
          document.documentElement.style.fontSize = uiScale + "%";
        }
        var codeSize = parseFloat(localStorage.getItem("orbit-code-size"));
        if (codeSize >= 10 && codeSize <= 18 && codeSize !== 12) {
          document.documentElement.style.setProperty("--app-code-size", codeSize + "px");
        }
        var density = parseFloat(localStorage.getItem("orbit-density"));
        if (density >= 85 && density <= 115 && density !== 100) {
          document.documentElement.style.setProperty("--spacing", (4 * density / 100).toFixed(2) + "px");
        }
      } catch (e) {}
    })();
  </script>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Cascadia+Code:wght@200..700&family=DM+Sans:opsz,wght@9..40,100..1000&family=Fira+Code:wght@300..700&family=Geist:wght@100..900&family=Geist+Mono:wght@100..900&family=IBM+Plex+Mono:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&family=Inter:opsz,wght@14..32,100..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Manrope:wght@200..800&family=Noto+Sans:wght@100..900&family=Roboto:wght@100..900&family=Roboto+Mono:wght@100..700&family=Source+Code+Pro:wght@200..900&family=Source+Sans+3:wght@200..900&display=swap" rel="stylesheet">

  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

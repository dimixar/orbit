[package]
name = "orbit-pi"
version = "0.1.0"
description = "Native GPUI workbench for the pi coding agent"
edition.workspace = true
license.workspace = true

[package.metadata.bundle]
name = "Orbit Pi"
identifier = "dev.orbit.pi"
icon = ["../../assets/icons/icon.icns"]
osx_minimum_system_version = "13.0"

[dependencies]
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
# Native open/folder dialogs (NSOpenPanel on macOS) for folder selection
rfd = "0.15"
orbit-rpc = { path = "../orbit-rpc" }
serde_json = { workspace = true }
unicode-segmentation = "1"
include_dir = "0.7"
anyhow = { workspace = true }
# Local-time formatting for response-footer timestamps
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# base64 payloads for prompt image attachments
base64 = "0.22"
devicons = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
# Match gpui 0.2.2 so we can set the Dock icon from the embedded PNG
# when running without a bundled .app (cargo run).
cocoa = "=0.26.0"
# Detect installed editors/terminals and open workspace folders in them.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSBitmapImageRep",
    "NSImage",
    "NSImageRep",
    "NSWorkspace",
    "block2",
    "objc2-core-graphics",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSArray",
    "NSDictionary",
    "NSString",
    "NSURL",
] }
url = "2.5"

[dev-dependencies]
gpui = { version = "0.2.2", features = ["runtime_shaders", "test-support"] }

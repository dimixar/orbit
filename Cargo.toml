[workspace]
resolver = "2"
members = [
    "crates/orbit-pi",
    "crates/orbit-rpc",
]
# src-tauri keeps its own lockfile/build — it is the legacy app and must not
# join the workspace until it is deleted at parity.
exclude = ["src-tauri"]

[workspace.package]
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Faster debug builds at the expense of runtime performance — fine for a
# rendering spike. Drop this when measuring real-world perf.
[profile.dev]
opt-level = 1
